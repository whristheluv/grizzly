services:
  grizzlysms-bot:
    build: .
    container_name: grizzlysms-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      STATE_FILE: /data/purchase.json
    volumes:
      - state:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  state:
